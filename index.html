const gtable=(heads,rows)=>`<div class="table-scroll"><table class="gramtable"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const LESSONS=[
{id:'nominative',title:'Nominativ: who does it?',subtitle:'Subjects and the basic articles',level:'A1',minutes:12,icon:'01',
 body:`<p>The <b>nominative</b> tells you <b>who or what is doing something</b>. Ask <b>wer?</b> (who?) or <b>was?</b> (what?). It is the case of the subject.</p>${gtable(['Gender','Article','Example'],[['Masculine','<b class="dertext">der</b>','der Mann'],['Feminine','<b class="dietext">die</b>','die Frau'],['Neuter','<b class="dastext">das</b>','das Kind'],['Plural','<b class="dietext">die</b>','die Kinder']])}${gex('Der Lehrer spricht Deutsch.','The teacher speaks German.')}${gex('Das Kind spielt.','The child is playing.')}<div class="rule">Remember: der = masculine, die = feminine/plural, das = neuter in the nominative.</div><h3>Ask the right question</h3><p><b>Wer lernt?</b> – Die Frau. <b>Was funktioniert?</b> – Das Telefon.</p>`,
 quiz:[['___ Mann arbeitet heute.',['Der','Den','Dem'],0,'The man is the subject: der Mann.'],['___ Frau lernt Deutsch.',['Das','Die','Der'],1,'Frau is feminine and subject: die Frau.'],['___ Kind schläft.',['Das','Den','Dem'],0,'Kind is neuter: das Kind.'],['___ Bücher sind neu.',['Der','Das','Die'],2,'Plural nominative: die Bücher.']]},
{id:'accusative',title:'Akkusativ: whom or what?',subtitle:'Direct objects and changing articles',level:'A1',minutes:14,icon:'02',
 body:`<p>Use the <b>accusative</b> for the direct object: the person or thing affected by the action. Ask <b>wen?</b> or <b>was?</b>.</p>${gtable(['Gender','Nominativ','Akkusativ'],[['Masculine','der','<b>den</b>'],['Feminine','die','die'],['Neuter','das','das'],['Plural','die','die']])}<div class="rule">Only masculine <b>der → den</b> changes with the definite article.</div>${gex('Ich sehe den Mann.','I see the man.')}${gex('Ich kaufe eine Tasche.','I buy a bag.')}${gex('Er liest das Buch.','He reads the book.')}<h3>Indefinite articles</h3><p><b>ein → einen</b> for masculine direct objects: <b>Ich habe einen Hund.</b></p>`,
 quiz:[['Ich sehe ___ Hund.',['der','den','dem'],1,'Hund is masculine; direct object → den.'],['Sie kauft ___ Apfel.',['einen','ein','einem'],0,'Masculine accusative with ein → einen.'],['Wir lesen ___ Buch.',['dem','das','den'],1,'Neuter accusative stays das.'],['Er besucht ___ Freundin.',['die','der','den'],0,'Feminine accusative stays die.']]},
{id:'dative',title:'Dativ: to whom?',subtitle:'Recipients, help and indirect objects',level:'A1–A2',minutes:15,icon:'03',
 body:`<p>Use the <b>dative</b> for recipients, many indirect objects and after certain prepositions. Ask <b>wem?</b> (to whom?).</p>${gtable(['Gender','Nominativ','Dativ'],[['Masculine','der','<b>dem</b>'],['Feminine','die','<b>der</b>'],['Neuter','das','<b>dem</b>'],['Plural','die','<b>den …n</b>']])}${gex('Ich helfe dem Mann.','I help the man.')}${gex('Sie gibt der Frau ein Buch.','She gives the woman a book.')}${gex('Ich spreche mit den Kindern.','I speak with the children.')}<div class="rule">Dative plural nouns often add <b>-n</b>: den Kindern, den Freunden, unless already ending in -n or -s.</div>`,
 quiz:[['Ich helfe ___ Frau.',['die','der','den'],1,'Frau is feminine; in dative use der.'],['Das Buch gehört ___ Kind.',['dem','das','den'],0,'Neuter dative: dem Kind.'],['Er spricht mit ___ Freunden.',['die','den','der'],1,'Plural dative: den Freunden.'],['Ich danke ___ Lehrer.',['den','der','dem'],2,'Lehrer is masculine; dative: dem Lehrer.']]},
{id:'genitive',title:'Genitiv: whose?',subtitle:'Belonging and possession',level:'A2',minutes:13,icon:'04',
 body:`<p>The <b>genitive</b> shows possession or relationships. Ask <b>wessen?</b> (whose?).</p>${gtable(['Gender','Genitive article','Example'],[['Masculine','<b>des</b>','des Mannes'],['Feminine','<b>der</b>','der Frau'],['Neuter','<b>des</b>','des Kindes'],['Plural','<b>der</b>','der Kinder']])}<div class="rule">Masculine and neuter singular nouns commonly add <b>-s or -es</b>.</div>${gex('Das Auto des Lehrers ist neu.','The teacher’s car is new.')}${gex('Die Tasche der Frau ist hier.','The woman’s bag is here.')}<p>In everyday speech, <b>von + dative</b> often expresses possession, but the genitive is useful in written German.</p>`,
 quiz:[['Das ist das Auto ___ Mannes.',['der','des','dem'],1,'Masculine genitive: des Mannes.'],['Die Farbe ___ Hauses ist weiß.',['des','der','den'],0,'Neuter genitive: des Hauses.'],['Der Hund ___ Frau ist klein.',['die','dem','der'],2,'Feminine genitive: der Frau.'],['Die Bücher ___ Kinder sind hier.',['des','der','dem'],1,'Plural genitive: der Kinder.']]},
{id:'prep-acc',title:'Prepositions + Akkusativ',subtitle:'für, ohne, durch, gegen, um, bis',level:'A1–A2',minutes:12,icon:'05',
 body:`<p>Some prepositions always require the <b>accusative</b>. Memorize this group: <b>durch, für, gegen, ohne, um</b> (also <b>bis</b>, whose usage can differ with following prepositions).</p>${gtable(['Preposition','Meaning','Example'],[['für','for','für den Lehrer'],['ohne','without','ohne einen Stift'],['durch','through','durch den Park'],['gegen','against','gegen den Wind'],['um','around / at','um den Tisch']])}${gex('Das Geschenk ist für den Mann.','The gift is for the man.')}${gex('Ich gehe ohne meinen Bruder.','I go without my brother.')}<div class="rule">After <b>für</b> you say <b>für mich, für dich, für ihn</b> — not mir, dir, ihm.</div>`,
 quiz:[['Das ist für ___ Vater.',['der','dem','den'],2,'für takes accusative: den Vater.'],['Sie läuft durch ___ Park.',['den','dem','der'],0,'durch always takes accusative.'],['Ich komme ohne ___ Bruder.',['mein','meinen','meinem'],1,'ohne + masculine accusative: meinen.'],['Er fährt gegen ___ Baum.',['dem','den','der'],1,'gegen takes accusative.']]},
{id:'prep-dat',title:'Prepositions + Dativ',subtitle:'mit, nach, bei, seit, von, zu, aus',level:'A1–A2',minutes:12,icon:'06',
 body:`<p>These prepositions take the <b>dative</b>: <b>aus, außer, bei, mit, nach, seit, von, zu</b> and <b>gegenüber</b>.</p>${gtable(['Preposition','Meaning','Example'],[['mit','with','mit dem Bus'],['nach','to / after','nach dem Essen'],['bei','at / with','bei der Arbeit'],['seit','since / for','seit einem Jahr'],['von','from / of','von meinem Freund'],['zu','to','zu der Schule → zur Schule'],['aus','out of / from','aus dem Haus']])}${gex('Ich fahre mit dem Zug.','I travel by train.')}${gex('Sie wohnt bei ihrer Schwester.','She lives with her sister.')}<div class="rule">Common contractions: <b>zu dem = zum</b>, <b>zu der = zur</b>, <b>bei dem = beim</b>, <b>von dem = vom</b>.</div>`,
 quiz:[['Ich fahre mit ___ Bus.',['der','den','dem'],2,'mit requires dative.'],['Wir wohnen bei ___ Eltern.',['den','die','der'],0,'bei requires dative plural: den Eltern.'],['Sie kommt aus ___ Stadt.',['die','der','den'],1,'aus requires dative feminine: der Stadt.'],['Ich gehe zu ___ Arzt.',['dem','den','der'],0,'zu takes dative: zum Arzt.']]},
{id:'prep-two',title:'Two-way prepositions',subtitle:'Where? (wo) vs where to? (wohin)',level:'A2',minutes:16,icon:'07',
 body:`<p><b>an, auf, hinter, in, neben, über, unter, vor, zwischen</b> may take either accusative or dative.</p><div class="rule"><b>Wohin? → accusative</b> when expressing direction to a destination.<br><b>Wo? → dative</b> when expressing a location.</div>${gex('Ich gehe in die Schule.','I go into/to school. (destination)')}${gex('Ich bin in der Schule.','I am in school. (location)')}${gex('Ich lege das Buch auf den Tisch.','I put the book onto the table.')}${gex('Das Buch liegt auf dem Tisch.','The book is lying on the table.')}<p>It is about <b>change of location vs location</b>, not simply whether the verb describes movement.</p>`,
 quiz:[['Ich gehe in ___ Küche.',['der','die','dem'],1,'Destination: in die Küche.'],['Ich bin in ___ Küche.',['die','der','den'],1,'Location: in der Küche.'],['Das Handy liegt auf ___ Tisch.',['dem','den','der'],0,'Location: auf dem Tisch.'],['Ich stelle den Stuhl neben ___ Bett.',['dem','das','der'],1,'Destination: neben das Bett.']]},
{id:'pronouns',title:'Personal pronouns',subtitle:'ich, mich, mir — and the others',level:'A1–A2',minutes:15,icon:'08',
 body:`<p>Personal pronouns change with their role in a sentence. The most important rows are <b>nominative</b> (subject), <b>accusative</b> (direct object) and <b>dative</b> (recipient).</p>${gtable(['Person','Nom.','Akk.','Dat.'],[['I','ich','mich','mir'],['you (informal)','du','dich','dir'],['he','er','ihn','ihm'],['she','sie','sie','ihr'],['it','es','es','ihm'],['we','wir','uns','uns'],['you (plural)','ihr','euch','euch'],['they','sie','sie','ihnen'],['you (formal)','Sie','Sie','Ihnen']])}${gex('Er sieht mich.','He sees me.')}${gex('Ich gebe ihm ein Buch.','I give him a book.')}${gex('Kannst du mir helfen?','Can you help me?')}<p>The genitive pronoun forms also exist, but they are much less common in everyday conversation.</p>`,
 quiz:[['Kannst du ___ helfen?',['mich','mir','ich'],1,'helfen takes dative: mir.'],['Ich sehe ___. (him)',['er','ihm','ihn'],2,'Direct object: ihn.'],['Das Geschenk ist für ___. (us)',['wir','uns','unser'],1,'für takes accusative: uns.'],['Ich spreche mit ___. (her)',['sie','ihr','ihre'],1,'mit takes dative: ihr.']]},
{id:'possessives',title:'Possessives: mein, dein, sein',subtitle:'Whose book? Whose car?',level:'A1–A2',minutes:16,icon:'09',
 body:`<p><b>mein, dein, sein, ihr, unser, euer, Ihr</b> show belonging. Their endings change by case and noun gender, similar to <b>ein</b>.</p>${gtable(['Owner','Base form'],[['I','mein'],['you (du)','dein'],['he / it','sein'],['she / they','ihr'],['we','unser'],['you (ihr)','euer'],['you (formal)','Ihr']])}${gtable(['Case','Masc.','Fem.','Neut.','Plural'],[['Nom.','mein Vater','meine Mutter','mein Kind','meine Freunde'],['Acc.','meinen Vater','meine Mutter','mein Kind','meine Freunde'],['Dat.','meinem Vater','meiner Mutter','meinem Kind','meinen Freunden']])}${gex('Das ist meine Tasche.','This is my bag.')}${gex('Ich sehe deinen Bruder.','I see your brother.')}${gex('Ich helfe unserem Kind.','I help our child.')}`, 
 quiz:[['Das ist ___ Auto. (my)',['mein','meine','meinen'],0,'Auto is neuter nominative: mein Auto.'],['Ich suche ___ Schlüssel. (my)',['mein','meinen','meinem'],1,'Masculine accusative: meinen Schlüssel.'],['Sie spricht mit ___ Mutter. (her)',['ihre','ihrer','ihren'],1,'Feminine dative: ihrer Mutter.'],['___ Schwester ist hier. (your, du)',['Deine','Deinen','Deinem'],0,'Feminine nominative: deine Schwester.']]},
{id:'adj-definite',title:'Adjective endings with der/die/das',subtitle:'der kleine Mann, die kleine Frau',level:'A2',minutes:17,icon:'10',
 body:`<p>After <b>der, die, das</b> and similar words like <b>dieser</b>, adjectives have mostly <b>-e</b> and <b>-en</b> endings.</p>${gtable(['Case','Masculine','Feminine','Neuter','Plural'],[['Nominative','der klein<b>e</b> Mann','die klein<b>e</b> Frau','das klein<b>e</b> Kind','die klein<b>en</b> Kinder'],['Accusative','den klein<b>en</b> Mann','die klein<b>e</b> Frau','das klein<b>e</b> Kind','die klein<b>en</b> Kinder'],['Dative','dem klein<b>en</b> Mann','der klein<b>en</b> Frau','dem klein<b>en</b> Kind','den klein<b>en</b> Kindern'],['Genitive','des klein<b>en</b> Mannes','der klein<b>en</b> Frau','des klein<b>en</b> Kindes','der klein<b>en</b> Kinder']])}<div class="rule">Easy shortcut: nominative singular uses <b>-e</b>. Nearly every other form uses <b>-en</b>, except feminine/neuter accusative singular (also <b>-e</b>).</div>${gex('Ich sehe den kleinen Hund.','I see the small dog.')}${gex('Ich helfe der netten Frau.','I help the nice woman.')}`,
 quiz:[['der ___ Mann',['kleine','kleinen','kleiner'],0,'Definite article + nominative masculine: -e.'],['Ich sehe den ___ Hund.',['kleine','kleinen','kleines'],1,'Masculine accusative: -en.'],['mit der ___ Frau',['netten','nette','netter'],0,'Dative after definite article: -en.'],['das ___ Kind',['kleines','kleinen','kleine'],2,'Neuter nominative after das: -e.']]},
{id:'adj-indefinite',title:'Adjective endings with ein/eine',subtitle:'ein großer Mann, eine große Frau',level:'A2',minutes:18,icon:'11',
 body:`<p>With <b>ein, eine, kein, mein</b>, etc., the adjective sometimes carries the gender information that the article does not show.</p>${gtable(['Case','Masculine','Feminine','Neuter'],[['Nominative','ein groß<b>er</b> Mann','eine groß<b>e</b> Frau','ein groß<b>es</b> Kind'],['Accusative','einen groß<b>en</b> Mann','eine groß<b>e</b> Frau','ein groß<b>es</b> Kind'],['Dative','einem groß<b>en</b> Mann','einer groß<b>en</b> Frau','einem groß<b>en</b> Kind'],['Genitive','eines groß<b>en</b> Mannes','einer groß<b>en</b> Frau','eines groß<b>en</b> Kindes']])}${gex('Ein guter Freund hilft mir.','A good friend helps me.')}${gex('Ich kaufe ein neues Handy.','I buy a new phone.')}${gex('Mit einer netten Kollegin.','With a nice colleague.')}<div class="rule">Indefinite masculine nominative: <b>-er</b>. Neuter nominative/accusative: <b>-es</b>. Many other positions: <b>-en</b>.</div>`,
 quiz:[['ein ___ Mann',['gute','guten','guter'],2,'ein + masculine nominative needs -er.'],['eine ___ Frau',['nettes','nette','netten'],1,'Feminine nominative: -e.'],['ein ___ Auto',['schneller','schnelles','schnellen'],1,'Neuter nominative: -es.'],['mit einem ___ Lehrer',['guter','guten','gutes'],1,'Dative after einem: -en.']]},
{id:'adj-none',title:'Adjectives without an article',subtitle:'starker Kaffee, kaltes Wasser',level:'B1 preview',minutes:17,icon:'12',
 body:`<p>If there is <b>no article</b>, the adjective carries most of the information about gender and case. This is called <b>strong declension</b>.</p>${gtable(['Case','Masculine','Feminine','Neuter','Plural'],[['Nominative','gut<b>er</b> Kaffee','gut<b>e</b> Suppe','gut<b>es</b> Essen','gut<b>e</b> Freunde'],['Accusative','gut<b>en</b> Kaffee','gut<b>e</b> Suppe','gut<b>es</b> Essen','gut<b>e</b> Freunde'],['Dative','gut<b>em</b> Kaffee','gut<b>er</b> Suppe','gut<b>em</b> Essen','gut<b>en</b> Freunden'],['Genitive','gut<b>en</b> Kaffees','gut<b>er</b> Suppe','gut<b>en</b> Essens','gut<b>er</b> Freunde']])}${gex('Frisches Brot schmeckt gut.','Fresh bread tastes good.')}${gex('Ich trinke heißen Tee.','I drink hot tea.')}<p>This topic is a bridge from your A1–A2 reference sheet to B1 German.</p>`,
 quiz:[['___ Kaffee ist lecker.',['Guter','Guten','Gutem'],0,'Masculine nominative, no article: -er.'],['Ich trinke ___ Wasser.',['kalter','kaltes','kalten'],1,'Neuter accusative, no article: -es.'],['mit ___ Wasser',['kaltem','kalten','kaltes'],0,'Neuter dative, no article: -em.'],['___ Freunde kommen.',['Guten','Gute','Guter'],1,'Plural nominative, no article: -e.']]},
{id:'reflexives',title:'Reflexive verbs',subtitle:'mich, dich, sich — mir, dir',level:'A2',minutes:14,icon:'13',
 body:`<p>A reflexive verb refers back to the subject: <b>ich wasche mich</b> (I wash myself), <b>ich beeile mich</b> (I hurry).</p>${gtable(['Person','Accusative','Dative'],[['ich','mich','mir'],['du','dich','dir'],['er/sie/es','sich','sich'],['wir','uns','uns'],['ihr','euch','euch'],['sie/Sie','sich','sich']])}${gex('Ich freue mich auf morgen.','I am looking forward to tomorrow.')}${gex('Du musst dich beeilen.','You must hurry.')}${gex('Ich putze mir die Zähne.','I brush my teeth. (dative reflexive)')}<p>Use <b>dative</b> when another direct object is present, as in <b>mir die Zähne</b>.</p>`,
 quiz:[['Ich freue ___.',['mich','mir','sich'],0,'sich freuen takes accusative reflexive: mich.'],['Er wäscht ___.',['ihn','sich','ihm'],1,'Reflexive for er: sich.'],['Ich putze ___ die Zähne.',['mich','sich','mir'],2,'With direct object die Zähne, use mir.'],['Wir beeilen ___.',['uns','euch','sich'],0,'Reflexive for wir: uns.']]},
{id:'present',title:'Present tense — Präsens',subtitle:'Regular verbs and common patterns',level:'A1',minutes:17,icon:'14',
 body:`<p>For most regular verbs, start from the infinitive, remove <b>-en</b> and add a personal ending. Example: <b>lernen → lern-</b>.</p>${gtable(['Person','lernen','machen'],[['ich','lerne','mache'],['du','lernst','machst'],['er/sie/es','lernt','macht'],['wir','lernen','machen'],['ihr','lernt','macht'],['sie/Sie','lernen','machen']])}${gex('Ich lerne Deutsch.','I am learning German.')}${gex('Du arbeitest heute.','You are working today.')}${gex('Er sieht einen Film.','He watches a film. (irregular change)')}<div class="rule">Endings: <b>-e, -st, -t, -en, -t, -en</b>. Some irregular verbs change vowels in du / er-sie-es: <b>sehen → siehst / sieht</b>.</div>`,
 quiz:[['Ich ___ Deutsch.',['lernst','lerne','lernt'],1,'ich + regular verb: -e.'],['Du ___ jeden Tag.',['arbeitest','arbeiten','arbeitet'],0,'Stem ends -t, add -est.'],['Er ___ ein Buch.',['lese','liest','lesen'],1,'lesen → er liest.'],['Wir ___ in Deutschland.',['wohnt','wohnst','wohnen'],2,'wir + infinitive: wohnen.']]},
{id:'sein-haben',title:'Sein and haben',subtitle:'Your two most important verbs',level:'A1',minutes:16,icon:'15',
 body:`<p><b>sein</b> (to be) and <b>haben</b> (to have) appear everywhere, including as helpers for the perfect tense.</p>${gtable(['Person','sein','haben'],[['ich','bin','habe'],['du','bist','hast'],['er/sie/es','ist','hat'],['wir','sind','haben'],['ihr','seid','habt'],['sie/Sie','sind','haben']])}<h3>Simple past (Präteritum)</h3>${gtable(['Person','sein','haben'],[['ich','war','hatte'],['du','warst','hattest'],['er/sie/es','war','hatte'],['wir','waren','hatten'],['ihr','wart','hattet'],['sie/Sie','waren','hatten']])}${gex('Ich bin müde, aber ich habe Zeit.','I am tired, but I have time.')}${gex('Gestern war ich krank.','Yesterday I was sick.')}<div class="rule">Memorize sein and haben first: they are essential for everyday German and the Perfekt.</div>`,
 quiz:[['Ich ___ heute frei.',['bin','bist','ist'],0,'sein with ich = bin.'],['Du ___ viel Zeit.',['habe','hat','hast'],2,'haben with du = hast.'],['Wir ___ gestern zu Hause.',['war','waren','wart'],1,'Past of sein with wir = waren.'],['Sie (she) ___ ein Auto.',['hast','haben','hat'],2,'haben with sie singular = hat.']]},
{id:'perfect',title:'Perfekt: talking about the past',subtitle:'haben/sein + Partizip II',level:'A2',minutes:18,icon:'16',
 body:`<p>In conversation, German often uses the <b>Perfekt</b> for completed past actions: <b>haben/sein + past participle</b>.</p>${gtable(['Verb','Perfekt','Meaning'],[['machen','hat gemacht','did; made'],['lernen','hat gelernt','learned'],['kaufen','hat gekauft','bought'],['sehen','hat gesehen','saw'],['gehen','ist gegangen','went'],['fahren','ist gefahren','traveled'],['kommen','ist gekommen','came'],['sein','ist gewesen','was']])}${gex('Ich habe Deutsch gelernt.','I learned German.')}${gex('Wir sind nach Berlin gefahren.','We traveled to Berlin.')}${gex('Hast du das Buch gelesen?','Did you read the book?')}<div class="rule">Many verbs of movement/change of state use <b>sein</b>; most others use <b>haben</b>. The participle usually goes to the end of the clause.</div>`,
 quiz:[['Ich ___ Deutsch gelernt.',['bin','habe','hat'],1,'lernen takes haben: ich habe gelernt.'],['Sie ___ nach Hause gegangen.',['ist','hat','sind'],0,'gehen takes sein.'],['Wir haben ein Auto ___.',['kaufe','gekauft','kaufen'],1,'kaufen → gekauft.'],['Er ___ gestern gekommen.',['hat','bist','ist'],2,'kommen takes sein: ist gekommen.']]},
{id:'preterite',title:'Präteritum: simple past',subtitle:'war, hatte, ging, lernte',level:'A2',minutes:14,icon:'17',
 body:`<p>The <b>Präteritum</b> is common in written stories and reports; <b>war</b>, <b>hatte</b>, and modal verbs are also very common in everyday speech.</p>${gtable(['Infinitive','Präteritum (ich / er)','Meaning'],[['sein','war','was'],['haben','hatte','had'],['lernen','lernte','learned'],['machen','machte','did'],['gehen','ging','went'],['kommen','kam','came'],['sehen','sah','saw'],['können','konnte','could']])}${gex('Früher wohnte ich in Kigali.','I used to live in Kigali.')}${gex('Ich hatte gestern keine Zeit.','I had no time yesterday.')}${gex('Er ging nach Hause.','He went home.')}<div class="rule">Regular verbs: <b>lern- + -te</b> → lernte. Irregular verbs must be learned individually.</div>`,
 quiz:[['Gestern ___ ich müde.',['war','bin','wurde'],0,'Past of sein: war.'],['Früher ___ er in Bonn.',['wohnt','wohnte','wohnen'],1,'Regular past: wohnte.'],['Sie ___ keine Zeit.',['hat','hatte','haben'],1,'Past of haben: hatte.'],['Er ___ nach Hause.',['ging','geht','gegangen'],0,'Präteritum of gehen: ging.']]},
{id:'future',title:'Futur I: the future',subtitle:'werden + infinitive',level:'A2',minutes:13,icon:'18',
 body:`<p>Future tense uses <b>werden + infinitive</b>. The conjugated werden takes second position; the main verb stays at the end.</p>${gtable(['Person','werden'],[['ich','werde'],['du','wirst'],['er/sie/es','wird'],['wir','werden'],['ihr','werdet'],['sie/Sie','werden']])}${gex('Ich werde morgen Deutsch lernen.','I will study German tomorrow.')}${gex('Wir werden nächste Woche reisen.','We will travel next week.')}${gex('Wirst du heute kochen?','Will you cook today?')}<p>German also uses the present for the future with a time word: <b>Morgen arbeite ich.</b> = I’m working tomorrow.</p>`,
 quiz:[['Ich ___ Deutsch lernen.',['werde','wirst','wird'],0,'werden with ich: werde.'],['Du ___ es schaffen.',['werdet','wirst','werden'],1,'werden with du: wirst.'],['Sie wird morgen ___.',['gearbeitet','arbeitet','arbeiten'],2,'Futur I ends with infinitive: arbeiten.'],['Wir ___ reisen.',['wird','werden','werde'],1,'werden with wir: werden.']]},
{id:'modal-verbs',title:'Modal verbs',subtitle:'können, müssen, dürfen, wollen…',level:'A1–A2',minutes:19,icon:'19',
 body:`<p>Modal verbs express what you <b>can, must, may, should, want</b> or <b>would like</b> to do. The modal verb is conjugated and the second verb comes at the end in the infinitive.</p>${gtable(['Verb','Meaning','ich','du','er/sie/es'],[['können','can','kann','kannst','kann'],['müssen','must','muss','musst','muss'],['dürfen','may / be allowed','darf','darfst','darf'],['sollen','should','soll','sollst','soll'],['wollen','want','will','willst','will'],['mögen','like','mag','magst','mag'],['möchten','would like','möchte','möchtest','möchte']])}${gex('Ich kann gut Deutsch sprechen.','I can speak German well.')}${gex('Du musst heute arbeiten.','You must work today.')}${gex('Darf ich hier sitzen?','May I sit here?')}<div class="rule">Modern spelling: <b>muss</b>, <b>musst</b> (not the old “muß / mußt” spelling shown in some old grammar charts).</div>`,
 quiz:[['Ich ___ Deutsch sprechen. (can)',['kann','könne','könnt'],0,'ich kann.'],['Du ___ heute lernen. (must)',['muss','musst','müssen'],1,'du musst.'],['___ ich hier parken? (may)',['Soll','Will','Darf'],2,'darf = may / be allowed.'],['Wir ___ nach Hause gehen. (want)',['will','wollen','wollt'],1,'wir wollen.']]},
{id:'word-order',title:'Word order & negation',subtitle:'Build useful everyday sentences',level:'A1–A2 bonus',minutes:17,icon:'20',
 body:`<p>German main statements normally keep the conjugated verb in <b>position 2</b>. A time expression can come first — the verb still goes second.</p>${gex('Ich lerne heute Deutsch.','I am studying German today.')}${gex('Heute lerne ich Deutsch.','Today I am studying German.')}${gex('Ich möchte morgen Deutsch lernen.','I would like to study German tomorrow.')}<h3>nicht vs kein</h3><p>Use <b>kein</b> before a noun with no definite article (or with ein): <b>Ich habe kein Auto.</b> Use <b>nicht</b> to negate a verb, an adjective or a specific idea: <b>Ich komme heute nicht.</b></p><h3>Questions</h3>${gex('Lernst du Deutsch?','Are you learning German?')}${gex('Wann kommst du?','When are you coming?')}<div class="rule">Main clause: verb second. Yes/no question: verb first. W-question: question word first, conjugated verb second.</div>`,
 quiz:[['Heute ___ ich Deutsch.',['lernen','lerne','gelernt'],1,'Verb stays second: Heute lerne ich.'],['Ich habe ___ Auto.',['nicht','keinen','kein'],2,'Neuter nominative/accusative with kein: kein Auto.'],['___ du Deutsch?',['Lernst','Lernen','Lerne'],0,'Yes/no question starts with the conjugated verb.'],['Er kommt heute ___.',['kein','keinen','nicht'],2,'Negate the action with nicht.']]}
];
</script>
<script>/* DeutschFlow: offline-capable learning app. Saves only in this browser. */
const NOUNS=[...JSON.parse(document.getElementById('noun-data').textContent),...(window.DF_EXTRA_NOUNS||[])];
const TOTAL=NOUNS.length;
const DAY_MS=86400000;
const STORAGE_KEY='deutschflow_mastery_v1';
const byId=Object.fromEntries(NOUNS.map(n=>[n.id,n]));
const ICONS={dashboard:'⌂',articles:'Aa',guided:'▣',grammar:'▤',flashcards:'▣',review:'↺',library:'☷',settings:'⚙'};
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const htmlEscape=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=(arr)=>{let a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const defaultStore=()=>({version:1,words:{},lessons:{},days:{},totalAnswered:0,totalCorrect:0,dailyGoal:20,quizSize:20,createdAt:Date.now()});
function loadStore(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s&&s.version===1&&s.words&&s.lessons&&s.days)return {...defaultStore(),...s};}catch(e){}return defaultStore()}
let db=loadStore();
const persist=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(e){}};
const recordFor=id=>db.words[id]||{seen:0,correct:0,wrong:0,streak:0,level:0,due:0,last:0};
const practiced=()=>Object.keys(db.words).filter(id=>db.words[id].seen>0).length;
const mastered=()=>Object.keys(db.words).filter(id=>db.words[id].streak>=3).length;
const completedLessons=()=>LESSONS.filter(l=>db.lessons[l.id]?.completed).length;
const countToday=()=>db.days[dateKey()]||0;
const accuracy=()=>db.totalAnswered?Math.round(db.totalCorrect/db.totalAnswered*100):0;
const allDays=()=>Object.keys(db.days).filter(k=>db.days[k]>0).sort().reverse();
function streakDays(){let n=0;let d=new Date();if(!(db.days[dateKey(d)]>0))d.setDate(d.getDate()-1);for(let i=0;i<365;i++){let k=dateKey(d);if(db.days[k]>0){n++;d.setDate(d.getDate()-1)}else break}return n}
function dueNouns(){return NOUNS.filter(n=>{let r=db.words[n.id];return r&&(r.wrong>0||r.seen>0&&r.due<=Date.now())&&!(r.streak>=3&&r.due>Date.now())})}
let ui={route:'dashboard',pack:0,articleMode:'quiz',listArticle:'all',listSearch:'',listCount:60,quiz:[],qi:0,chosen:null,submitted:false,sessionCorrect:0,sessionWrong:0,sessionDone:false,sessionSource:'pack',typingFeedback:null,studyShow:false,lessonId:null,lessonQuiz:false,grammarQi:0,grammarSelected:null,grammarScore:0,flashQueue:[],flashIndex:0,flashFlipped:false,menu:false};
const el=id=>document.getElementById(id);
function wordUpdate(id,isCorrect){let r={...recordFor(id)};r.seen++;r.last=Date.now();if(isCorrect){r.correct++;r.streak++;r.level=Math.min(r.level+1,6);r.due=Date.now()+[0,DAY_MS,DAY_MS*3,DAY_MS*7,DAY_MS*14,DAY_MS*30,DAY_MS*60][r.level]}else{r.wrong++;r.streak=0;r.level=0;r.due=Date.now()}db.words[id]=r;db.totalAnswered++;if(isCorrect)db.totalCorrect++;db.days[dateKey()]=(db.days[dateKey()]||0)+1;persist()}
const badge=(art)=>`<span class="pill ${art}">${art}</span>`;
const fullword=(n)=>`<span class="artext ${n.article}text">${n.article}</span> ${htmlEscape(n.word)}`;

function hintFor(n){const w=n.word.toLowerCase();if(n.article==='die'){if(w.endsWith('ung'))return 'Most nouns ending in -ung are feminine (die).';if(w.endsWith('heit')||w.endsWith('keit'))return '-heit / -keit nouns are usually feminine.';if(w.endsWith('schaft'))return '-schaft nouns are feminine.';if(w.endsWith('ion'))return '-tion/-ion nouns are normally feminine.';if(w.endsWith('in'))return 'Many feminine occupations end in -in.'}if(n.article==='das'){if(w.endsWith('chen')||w.endsWith('lein'))return '-chen and -lein nouns are neuter.';if(w.endsWith('ment'))return 'Most nouns ending in -ment are neuter.';if(w.endsWith('um'))return 'Many nouns ending in -um are neuter.'}if(n.article==='der'){if(/^(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|januar|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember|sommer|winter|herbst|frühling)$/.test(w))return 'Days, months and seasons are usually masculine.';if(w.endsWith('ling'))return '-ling nouns are usually masculine.'}return 'Memory tip: say and memorize the full pair, “'+n.article+' '+n.word+'”.'}

function libraryItems(){return NOUNS.filter(n=>(ui.listArticle==='all'||n.article===ui.listArticle)&&(!ui.listSearch||`${n.word} ${n.meaning} ${n.article}`.toLocaleLowerCase('de').includes(ui.listSearch.toLocaleLowerCase('de'))))}
function libraryCards(){let filtered=libraryItems(),shown=filtered.slice(0,ui.listCount);return `<div class="wordlist">${shown.map(n=>`<div class="wordlist-item"><div class="heading"><div class="articleword">${fullword(n)}</div><button class="iconbtn" title="Listen" aria-label="Pronounce ${htmlEscape(n.word)}" data-action="speak" data-word="${n.id}">♪</button></div><div class="meaning">${htmlEscape(n.meaning)}</div><div class="footer"><span class="pill purple">Pack ${Math.floor((n.id-1)/100)+1}</span>${recordFor(n.id).streak>=3?'<span class="pill green">✓ Mastered</span>':recordFor(n.id).wrong>0?'<span class="pill">Review</span>':'<span class="tiny muted">Learn + repeat</span>'}</div></div>`).join('')}</div>${filtered.length>ui.listCount?`<div style="text-align:center;margin:20px 0"><button class="btn ghost" data-action="library-more">Show more words (${filtered.length-ui.listCount} left)</button></div>`:''}<div class="sm muted" style="margin:10px 0">Showing ${shown.length} of ${filtered.length} matching nouns.</div>`}
function renderLibrary(){return `<div class="special-split"><div><div class="eyebrow">EXPLORE & SEARCH</div><h1>Your 2,000-word library</h1><p class="lead">Search by German word or English meaning. Listen to the pronunciation and learn the article in context.</p></div><span class="pill purple">${TOTAL} nouns</span></div><div class="toolbar"><div class="searchbar" style="flex:1"><span aria-hidden="true">⌕</span><input id="library-search" autocomplete="off" placeholder="Search German or English…" value="${htmlEscape(ui.listSearch)}" aria-label="Search words"></div><div class="filters">${['all','der','die','das'].map(a=>`<button class="chipbtn ${ui.listArticle===a?'active':''}" data-action="library-filter" data-article="${a}">${a==='all'?'All articles':a}</button>`).join('')}</div></div><div id="library-results">${libraryCards()}</div>`}
function renderSettings(){return `<div class="eyebrow">MAKE THIS YOUR OWN</div><h1>Your learning settings</h1><p class="lead">Tune your practice routine and protect your progress with backups.</p><div class="panel settings-card" style="margin-top:23px"><h2>Study preferences</h2><div class="settings-row"><div><label for="daily-goal">Daily practice goal</label><p>Number of vocabulary answers you aim to do every day.</p></div><select id="daily-goal" class="select" data-change="daily-goal">${[10,20,30,50,100].map(x=>`<option value="${x}" ${db.dailyGoal===x?'selected':''}>${x} answers</option>`).join('')}</select></div><div class="settings-row"><div><label for="quiz-size">Words per quiz</label><p>Smaller sessions help you stay consistent.</p></div><select id="quiz-size" class="select" data-change="quiz-size">${[10,20,30,50,100].map(x=>`<option value="${x}" ${db.quizSize===x?'selected':''}>${x} words</option>`).join('')}</select></div><div class="settings-row"><div><b>Audio pronunciation</b><p>Uses your browser's built-in German text-to-speech voice.</p></div><button class="btn gray small" data-action="speak-demo">♪ Try audio</button></div></div>
<div class="panel settings-card" style="margin-top:17px"><h2>Save your progress</h2><p class="sm muted">This site does not require an account. Your answers are saved in the current browser on this device. When moving to a hosted website, export here and import there.</p><div class="settings-row"><div><b>Download progress backup</b><p>Download a small JSON file with your scores and reviews.</p></div><button class="btn" data-action="export-progress">↓ Export</button></div><div class="settings-row"><div><b>Restore from a backup</b><p>Import an earlier DeutschFlow backup on this browser or another device.</p></div><button class="btn ghost" data-action="import-progress">↑ Import</button></div><div class="settings-row"><div><b>Reset your progress</b><p>This deletes local scores on this browser only.</p></div><button class="btn danger" data-action="reset-progress">Reset</button></div></div><div class="panel settings-card" style="margin-top:17px"><h2>About the course</h2><p class="sm muted">The grammar course follows your two-page A1–A2 German grammar reference: cases, prepositions, pronouns, adjective endings, verb tenses and modal verbs. An extra sentence-structure lesson and a 1,000-noun article trainer help you practise before moving into more complex grammar.</p><p class="sm muted">Important: noun endings are clues, not guarantees. Some words have more than one gender with a different meaning or regional usage. When in doubt, consult a dictionary.</p></div>`}
function toast(msg){const old=el('toast');if(old)old.remove();let e=document.createElement('div');e.className='toast';e.id='toast';e.setAttribute('role','status');e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function pronounce(word){if(!('speechSynthesis'in window)){toast('This browser does not support audio pronunciation.');return}try{window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='de-DE';u.rate=.84;u.pitch=1;let voices=window.speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase()==='de-de')||voices.find(x=>x.lang.startsWith('de'));if(v)u.voice=v;window.speechSynthesis.speak(u)}catch(e){toast('Audio is unavailable on this device.')}}
function answerArticle(value){if(ui.submitted||ui.sessionDone||!currQ())return;if(!['der','die','das'].includes(value)){toast('Please type der, die or das.');return}ui.chosen=value;ui.submitted=true;let correct=value===currQ().article;ui.sessionCorrect+=correct?1:0;ui.sessionWrong+=correct?0:1;wordUpdate(currQ().id,correct);render();}
function gradeFlash(good){let id=ui.flashQueue[ui.flashIndex];if(!id)return;wordUpdate(id,good);ui.flashIndex++;ui.flashFlipped=false;render()}
function gradeGrammar(i){if(ui.grammarSelected!==null)return;ui.grammarSelected=i;let l=lesson(),correct=i===l.quiz[ui.grammarQi][2];if(correct)ui.grammarScore++;db.days[dateKey()]=(db.days[dateKey()]||0)+1;persist();render()}
function nextGrammar(){let l=lesson();if(ui.grammarQi>=l.quiz.length)return;ui.grammarQi++;ui.grammarSelected=null;if(ui.grammarQi===l.quiz.length){let prev=db.lessons[l.id]||{attempts:0,score:0,completed:false};prev.attempts++;prev.score=Math.max(prev.score,ui.grammarScore);if(ui.grammarScore>=Math.ceil(l.quiz.length*.75))prev.completed=true;db.lessons[l.id]=prev;persist()}render()}
function clickAction(target){const action=target.dataset.action;
 switch(action){
 case'nav':ui.lessonId=null;go(target.dataset.route);break;
 case'lesson':ui.lessonId=target.dataset.lesson;ui.lessonQuiz=false;ui.grammarQi=0;ui.grammarSelected=null;go('grammar');break;
 case'close-lesson':ui.lessonId=null;ui.lessonQuiz=false;render();break;
 case'next-lesson':{let i=LESSONS.findIndex(l=>l.id===ui.lessonId);if(i+1<LESSONS.length){ui.lessonId=LESSONS[i+1].id;ui.lessonQuiz=false;ui.grammarQi=0;ui.grammarSelected=null;render();window.scrollTo(0,0)}break}
 case'start-lesson-quiz':ui.lessonQuiz=true;ui.grammarQi=0;ui.grammarSelected=null;ui.grammarScore=0;render();break;
 case'grammar-answer':gradeGrammar(Number(target.dataset.option));break;
 case'grammar-next':nextGrammar();break;
 case'art-mode':ui.articleMode=target.dataset.mode;if(ui.articleMode!=='study')prepareQuiz('pack');render();break;
 case'answer':answerArticle(target.dataset.value);break;
 case'check-typed':answerArticle((el('article-answer')?.value||'').toLowerCase().trim());break;
 case'next-question':if(!ui.submitted)return;ui.qi++;ui.chosen=null;ui.submitted=false;if(ui.qi>=ui.quiz.length)ui.sessionDone=true;render();break;
 case'restart-quiz':prepareQuiz('pack');render();break;
 case'next-pack':ui.pack=Math.min(19,ui.pack+1);prepareQuiz('pack');render();break;
 case'speak':{let n=byId[target.dataset.word];if(n)pronounce(n.article+' '+n.word);break}
 case'speak-demo':pronounce('der Tisch, die Tasche, das Buch');break;
 case'review-quiz':ui.articleMode='quiz';prepareQuiz(target.dataset.type==='mistakes'?'mistakes':'due');ui.route='articles';render();window.scrollTo(0,0);break;
 case'restart-flashcards':prepareFlashcards();render();break;
 case'flip':ui.flashFlipped=!ui.flashFlipped;render();break;
 case'flash-rate':if(ui.flashFlipped)gradeFlash(target.dataset.grade==='good');break;
 case'library-filter':ui.listArticle=target.dataset.article;ui.listCount=60;render();break;
 case'library-more':ui.listCount+=60;render();break;
 case'export-progress':{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deutschflow-progress-'+dateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded.');break;}
 case'import-progress':el('import-file').click();break;
 case'reset-progress':{if(confirm('Delete all your saved progress in this browser? Export a backup first if you want to keep it.')){db=defaultStore();persist();ui.quiz=[];ui.flashQueue=[];render();toast('Local progress reset.')}break;}
 case'menu-toggle':ui.menu=!ui.menu;updateNav();break;
 case'menu-close':ui.menu=false;updateNav();break;
 default:break;
 }}

// DeutschFlow 3: Study first, memorize thoroughly, then test the same exact set.
// Preserve the existing localStorage key, word IDs, and historic practice scores.
const DF_GROUPS=['der','die','das'];
function dfGuided(){
 const defaults={size:30,set:0,phase:'read',ready:false,q:0,answer:null,correct:0,wrong:0,auto:false,revealed:[],completedSets:{}};
 if(!db.guided||typeof db.guided!=='object')db.guided={...defaults};
 const g=db.guided;
 if(![30,50].includes(g.size))g.size=30;
 g.set=Math.max(0,Math.min(Math.ceil(NOUNS.length/g.size)-1,Number(g.set)||0));
 if(!['read','memorize','test','done'].includes(g.phase))g.phase='read';
 if(!Array.isArray(g.revealed))g.revealed=[];
 if(!g.completedSets||typeof g.completedSets!=='object')g.completedSets={};
 if(!Number.isFinite(g.q)||g.q<0)g.q=0;
 return g;
}
function dfCurrentWords(){const g=dfGuided();return NOUNS.slice(g.set*g.size,(g.set+1)*g.size)}
function dfSave(){persist()}
function dfSpeak(id){const n=byId[id];if(n)pronounce(n.article+' '+n.word)}
function dfFocus(){requestAnimationFrame(()=>requestAnimationFrame(()=>{
 const q=document.getElementById('df-qcard');if(!q)return;
 const top=Math.max(0,window.scrollY+q.getBoundingClientRect().top-(window.innerWidth<650?12:20));
 window.scrollTo({top,behavior:'instant'});
}))}
let dfAutonextTimer=null;
function dfCancelTimer(){if(dfAutonextTimer!==null){clearTimeout(dfAutonextTimer);dfAutonextTimer=null}}
function dfBeginReading(){const g=dfGuided();dfCancelTimer();g.phase='read';g.ready=false;g.revealed=[];g.q=0;g.answer=null;g.correct=0;g.wrong=0;dfSave();render();window.scrollTo({top:0,behavior:'instant'})}
function dfBeginMemorizing(){const g=dfGuided();if(g.phase!=='read')return;g.phase='memorize';g.ready=false;g.revealed=[];dfSave();render();window.scrollTo({top:0,behavior:'instant'})}
function dfBeginTest(){const g=dfGuided();if(g.phase!=='memorize'||!g.ready)return;g.phase='test';g.q=0;g.answer=null;g.correct=0;g.wrong=0;dfSave();render();dfFocus()}
function dfMoveNext(){dfCancelTimer();const g=dfGuided(),a=dfCurrentWords();if(g.phase!=='test'||g.answer===null)return;
 g.q++;g.answer=null;
 if(g.q>=a.length){g.phase='done';g.completedSets[g.size+':'+g.set]={completedAt:Date.now(),score:g.correct,total:a.length};}
 dfSave();render();if(g.phase==='test')dfFocus();else window.scrollTo({top:0,behavior:'instant'});
}
function dfAnswer(article){const g=dfGuided(),a=dfCurrentWords(),n=a[g.q];if(g.phase!=='test'||g.answer!==null||!n)return;
 const good=article===n.article;g.answer=article;g.correct+=good?1:0;g.wrong+=good?0:1;
 wordUpdate(n.id,good);dfSave();render();dfFocus();
 if(good&&g.auto){const q=g.q;dfAutonextTimer=setTimeout(()=>{const gg=dfGuided();if(gg.phase==='test'&&gg.q===q&&gg.answer!==null)dfMoveNext()},950)}
}
function dfStepStrip(phase){const steps=[['read','1','Read all words'],['memorize','2','Memorize'],['test','3','Answer quiz']];
 const current=phase==='done'?3:Math.max(0,steps.findIndex(s=>s[0]===phase));
 return `<div class="df-steps" aria-label="Learning steps">${steps.map((s,i)=>`<div class="df-step ${i===current?'active':i<current?'finished':''}"><span>${i<current?'✓':s[1]}</span><b>${s[2]}</b></div>`).join('<i aria-hidden="true">→</i>')}</div>`;
}
function dfGoalCard(g,words){const completed=Object.keys(g.completedSets).filter(k=>k.startsWith(g.size+':')).length,total=Math.ceil(NOUNS.length/g.size),done=Math.min(total,completed);
 const learned=Object.values(g.completedSets).filter(Boolean).reduce((sum,x)=>sum+(x.total||0),0);
 return `<div class="df-goal"><div><div class="df-goal-label">YOUR LEARNING GOAL</div><h2>Learn ${g.size} words. Remember them. Then test yourself.</h2><p>Don't rush to answer. First understand each noun with its article and meaning.</p></div><div class="df-goal-stats"><div><strong>${done} / ${total}</strong><span>Sets completed</span></div><div><strong>${Math.min(learned,NOUNS.length)}</strong><span>Words studied in finished tests</span></div></div></div>`;
}
function dfToolRow(g,total){return `<div class="df-toolrow df-selectors"><label>Words in this lesson <select aria-label="Words per lesson" data-df="size"><option value="30" ${g.size===30?'selected':''}>30 words</option><option value="50" ${g.size===50?'selected':''}>50 words</option></select></label><label>Learning set <select aria-label="Choose learning set" data-df="set">${Array.from({length:total},(_,i)=>`<option value="${i}" ${g.set===i?'selected':''}>Set ${i+1} of ${total}${g.completedSets[g.size+':'+i]?' ✓':''}</option>`).join('')}</select></label></div>`}
function dfReadCard(n){return `<div class="df-word"><button type="button" title="Listen to German pronunciation" aria-label="Listen to ${htmlEscape(n.word)}" data-df="speak" data-id="${n.id}">♪</button><div class="df-word-main"><b class="${n.article}text">${n.article}</b> <b>${htmlEscape(n.word)}</b></div><em>${htmlEscape(n.meaning)}${n.plural?' · plural: '+htmlEscape(n.plural):''}</em></div>`}
function renderGuided(){const g=dfGuided(),words=dfCurrentWords(),totalSets=Math.ceil(NOUNS.length/g.size),at=g.set+1;
 const inRead=g.phase==='read',inMem=g.phase==='memorize',inTest=g.phase==='test',completed=g.phase==='done';
 const heading=inRead?'Read and understand every word':inMem?'Memorize the words before the test':inTest?'Now test what you learned':'Great work — set completed!';
 const subtitle=inRead?'All words and their correct articles are shown below. Scroll through DER, DIE and DAS; say each word out loud.':inMem?'Try to recall the correct article before revealing it. The words are mixed now so the group cannot give away the answer.':inTest?'Choose the correct article for each word from the same set you studied.':'Your answers have been saved. Repeat the set or continue learning.';
 const top=`<section class="df-guided ${inTest?'df-test-active':''}"><div class="df-intro ${inTest?'df-quiz-intro':''}"><div class="eyebrow">DER · DIE · DAS · YOUR PERSONAL LEARNING PATH</div><h1>${heading}</h1><p>${subtitle}</p></div>${dfStepStrip(g.phase)}`;
 if(inRead){const groups=DF_GROUPS.map(a=>{const group=words.filter(n=>n.article===a);return `<section class="df-group"><h2><span class="${a}text">${a.toUpperCase()} <span class="df-gender">${a==='der'?'· Masculine':a==='die'?'· Feminine':'· Neuter'}</span></span><small>${group.length} words</small></h2><div class="df-group-grid">${group.map(dfReadCard).join('')}</div></section>`}).join('');
 return `${top}${dfGoalCard(g,words)}${dfToolRow(g,totalSets)}<div class="df-lesson-band"><b>Lesson ${at} of ${totalSets} · ${words.length} words</b><span>First read and memorize, then take the test.</span></div>${groups}<div class="df-study-action"><div><b>Finished reading your ${words.length} words?</b><p>You can come back to this list any time.</p></div><button class="btn" type="button" data-df="memorize">Continue to memorization →</button></div></section>`;
 }
 if(inMem){const recalled=new Set(g.revealed.map(Number)),seen=recalled.size;
 return `${top}<div class="df-study-panel"><div class="df-study-heading"><div><div class="eyebrow">STEP 2 OF 3 · RETRIEVAL PRACTICE</div><h2>Can you remember the article?</h2><p>Read the German noun and English meaning. Say <b>der, die,</b> or <b>das</b> in your head, then tap <b>Show article</b>. Practice until you feel ready.</p></div><span class="pill purple">${seen}/${words.length} revealed</span></div><div class="df-mem-grid">${words.map(n=>`<div class="df-mem-card ${recalled.has(n.id)?'seen':''}"><div class="df-mem-card-top"><strong>${htmlEscape(n.word)}</strong><button class="df-icon-speak" type="button" data-df="speak" data-id="${n.id}" aria-label="Listen to ${htmlEscape(n.word)}">♪</button></div><div class="df-translation">${htmlEscape(n.meaning)}</div>${recalled.has(n.id)?`<div class="df-revealed ${n.article}text">${n.article} ${htmlEscape(n.word)}</div>`:`<button class="df-reveal-btn" type="button" data-df="reveal" data-id="${n.id}">Show article</button>`}</div>`).join('')}</div><div class="df-mem-controls"><button type="button" class="btn gray" data-df="back-read">← Return to word list</button><button type="button" class="btn gray" data-df="reveal-all">Reveal all articles</button><button type="button" class="btn gray" data-df="hide-all">Hide articles</button></div><label class="df-confirm"><input type="checkbox" data-df="ready" ${g.ready?'checked':''}><span><b>I have memorized these ${words.length} words and I'm ready.</b><small>The test will use exactly the same words, without article hints.</small></span></label><button class="btn df-full-action" data-df="start" ${g.ready?'':'disabled'}>Start ${words.length}-word test →</button></div></section>`;
 }
 if(completed){const pct=Math.round(g.correct/Math.max(1,words.length)*100);return `${top}<div class="df-result"><div class="df-result-number">${pct}%</div><h2>${g.correct} correct out of ${words.length}</h2><p>${g.wrong?`You have ${g.wrong} word${g.wrong===1?'':'s'} to review.`:'Excellent! You answered every word correctly.'} It's fine to study the same set again until it feels natural.</p><div class="df-shortstats"><div><b>${words.length}</b>Words studied</div><div><b>${g.correct}</b>Correct</div><div><b>${g.wrong}</b>To review</div></div><div class="df-result-actions"><button class="btn" data-df="next-set">Study the next ${g.size} words →</button><button class="btn gray" data-df="retry">Study these words again</button><button class="btn gray" data-action="nav" data-route="review">Review mistakes</button></div></div></section>`;}
 const n=words[Math.min(g.q,words.length-1)],answered=g.answer!==null,good=answered&&g.answer===n.article;
 const choices=DF_GROUPS.map(a=>`<button class="df-choice ${answered&&a===n.article?'correct':answered&&a===g.answer?'wrong':''}" type="button" data-df="answer" data-article="${a}" ${answered?'disabled':''}>${a}</button>`).join('');
 const feedback=answered?`<div class="df-feedback ${good?'correct':'wrong'}" role="status"><b>${good?'✓ Correct!':'Not quite.'}</b> <span class="${n.article}text">${n.article} ${htmlEscape(n.word)}</span> means “${htmlEscape(n.meaning)}”. ${!good?'Review this one again after the set.':''}</div>`:'';
 return `${top}<div class="df-qcard" id="df-qcard"><div class="df-qhead"><span>Set ${at} of ${totalSets}</span><span>Question ${g.q+1} of ${words.length}</span></div><div class="df-qprogress"><span style="width:${(g.q+(answered?1:0))/words.length*100}%"></span></div><div class="df-qword"><div class="eyebrow">WHICH ARTICLE DID YOU MEMORIZE?</div><strong>${htmlEscape(n.word)}</strong><div class="df-meaning">${htmlEscape(n.meaning)}</div><button data-df="speak" data-id="${n.id}" title="Listen">♪ Listen</button></div><div class="df-choices">${choices}</div>${feedback}<div class="df-nextinline"><button class="btn" data-df="next" ${answered?'':'disabled'}>${g.q===words.length-1?'See my results →':'Next word →'}</button></div></div><div class="df-mobilebar"><label><input type="checkbox" data-df="auto" ${g.auto?'checked':''}> Auto-next ✓</label><button type="button" data-df="next" ${answered?'':'disabled'}>${g.q===words.length-1?'See results →':'Next word →'}</button></div></section>`;
}
// User actions for each stage; the main site's other event handlers remain intact.
document.addEventListener('click',e=>{
 const btn=e.target.closest('[data-df]');if(!btn||btn.tagName==='INPUT'||btn.tagName==='SELECT')return;
 const action=btn.dataset.df,g=dfGuided();
 if(action==='speak')dfSpeak(btn.dataset.id);
 else if(action==='memorize')dfBeginMemorizing();
 else if(action==='back-read'){g.phase='read';g.ready=false;dfSave();render();window.scrollTo({top:0,behavior:'instant'})}
 else if(action==='reveal'){const id=Number(btn.dataset.id);if(!g.revealed.includes(id))g.revealed.push(id);dfSave();render();const item=Array.from(document.querySelectorAll('.df-mem-card')).find(c=>c.textContent?.includes(byId[id]?.word));if(item)item.scrollIntoView({block:'nearest'});}
 else if(action==='reveal-all'){g.revealed=dfCurrentWords().map(n=>n.id);dfSave();render()}
 else if(action==='hide-all'){g.revealed=[];dfSave();render()}
 else if(action==='start')dfBeginTest();
 else if(action==='answer')dfAnswer(btn.dataset.article);
 else if(action==='next')dfMoveNext();
 else if(action==='retry')dfBeginReading();
 else if(action==='next-set'){g.set=(g.set+1)%Math.ceil(NOUNS.length/g.size);dfBeginReading();}
});
document.addEventListener('change',e=>{const t=e.target,g=dfGuided();if(!t.dataset.df)return;
 if(t.dataset.df==='size'){dfCancelTimer();g.size=Number(t.value)===50?50:30;g.set=0;dfBeginReading();}
 else if(t.dataset.df==='set'){dfCancelTimer();g.set=Math.max(0,Number(t.value)||0);dfBeginReading();}
 else if(t.dataset.df==='ready'){g.ready=t.checked;dfSave();const b=document.querySelector('[data-df="start"]');if(b)b.disabled=!g.ready;}
 else if(t.dataset.df==='auto'){g.auto=t.checked;dfSave();if(!g.auto)dfCancelTimer();}
});
document.addEventListener('keydown',e=>{
 if(ui.route!=='guided'||dfGuided().phase!=='test'||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName)||e.metaKey||e.altKey||e.ctrlKey)return;
 if(['1','2','3'].includes(e.key)&&dfGuided().answer===null){dfAnswer(DF_GROUPS[Number(e.key)-1]);e.preventDefault();}
 else if(e.key==='Enter'&&dfGuided().answer!==null){dfMoveNext();e.preventDefault();}
});
// Restore the guided learning journey as the main entry point, without removing the old dashboard.
const dfOriginalDashboard=renderDashboard;
renderDashboard=function(){const g=dfGuided(),today=db.days[dateKey()]||0,goal=Math.max(1,db.dailyGoal||20);
 const greeting=`<section class="df-dashboard-goal"><div><div class="eyebrow">START HERE · YOUR DAILY LEARNING GOAL</div><h2>Learn the words first. Test yourself after.</h2><p>Choose 30 or 50 new nouns, read their articles and meanings, memorize them, and then practise exactly what you learned.</p><button class="btn" data-action="nav" data-route="guided">${g.phase==='test'?'Resume my quiz':g.phase==='memorize'?'Continue memorizing':'Start reading my '+g.size+' words'} →</button></div><div class="df-dashboard-metric"><strong>${Math.min(today,goal)} / ${goal}</strong><small>Today's practice answers</small><div class="df-qprogress"><span style="width:${Math.min(100,today/goal*100)}%"></span></div></div></section>`;
 return greeting+dfOriginalDashboard();};
const dfOriginalArticles=renderArticles;
renderArticles=function(){return `<div class="df-study-first-banner"><div><b>New to this set? Learn before you test.</b><p>Read 30 or 50 words grouped by der, die and das, memorize them, then answer a quiz on the same words.</p></div><button class="btn" data-action="nav" data-route="guided">Study words first →</button></div>`+dfOriginalArticles();};
const dfOriginalUpdateNav=updateNav;
updateNav=function(){dfOriginalUpdateNav();if(ui.route==='guided')el('breadcrumb').textContent='Learn / Read · Memorize · Test';};
// Supplementary B1 units beyond the original PDF-based 20 lessons.
const DF_B1_TOPICS=[
 ['Subordinate clauses: weil, dass, obwohl','Put the conjugated verb at the end','Ich bleibe zu Hause, weil ich krank bin.','I stay home because I am ill.',[['Ich lerne, weil ich Deutsch ___ .',['lerne','lernen','lernt'],0],['Er sagt, dass er morgen ___ .',['kommt','kommen','kommst'],0],['Obwohl sie müde ___, arbeitet sie.',['ist','sein','sind'],0]]],
 ['When: wenn and als','Use als for one-time past events, wenn for repetition or condition','Als ich klein war, wohnte ich in Kigali.','When I was little, I lived in Kigali.',[['___ ich klein war, spielte ich oft.',['Als','Wenn','Weil'],0],['___ es regnet, bleibe ich zu Hause.',['Wenn','Als','Trotz'],0],['___ ich Zeit habe, lese ich.',['Wenn','Als','Denn'],0]]],
 ['Relative clauses','Use der, die, das (or inflected forms) for a relative clause','Das ist der Mann, der hier arbeitet.','This is the man who works here.',[['Das ist die Frau, ___ Deutsch lernt.',['die','den','dem'],0],['Das ist der Mann, ___ ich kenne.',['den','der','dem'],0],['Das Kind, ___ hier spielt, ist nett.',['das','dem','den'],0]]],
 ['Konjunktiv II: polite wishes','Use hätte, wäre, könnte, or würde + infinitive','Ich würde gern mehr Deutsch sprechen.','I would like to speak more German.',[['Ich ___ gern einen Kaffee.',['hätte','hatte','habe'],0],['___ Sie mir bitte helfen?',['Könnten','Können','Konnten'],0],['Wenn ich Zeit hätte, ___ ich reisen.',['würde','werde','bin'],0]]],
 ['Passive voice: werden + Partizip II','Passive emphasizes what happens to the subject','Der Brief wird geschrieben.','The letter is being written.',[['Das Essen wird ___.',['gekocht','kocht','kochen'],0],['Die Tür ___ geöffnet.',['wird','werden','ist sein'],0],['Die Autos werden ___.',['repariert','reparieren','reparierte'],0]]],
 ['Adjective endings (B1)','Adjective endings depend on article, case, and gender','Ich helfe dem kleinen Kind.','I help the small child.',[['Ich sehe den ___ Hund.',['kleinen','kleine','kleiner'],0],['Das ist ein ___ Haus.',['großes','große','großer'],0],['Mit einer ___ Freundin.',['netten','nette','netter'],0]]],
 ['Infinitive with zu','Use zu before infinitives in common constructions','Ich versuche, jeden Tag Deutsch zu lernen.','I try to learn German every day.',[['Ich habe vor, Deutsch ___ lernen.',['zu','—','zum'],0],['Es ist wichtig, genug ___ schlafen.',['zu','zum','—'],0],['Ich hoffe, dich bald ___ sehen.',['zu','am','den'],0]]],
 ['Genitive prepositions','wegen, während and trotz commonly take genitive','Trotz des Regens gehen wir spazieren.','Despite the rain, we go for a walk.',[['Wegen ___ Wetters bleibe ich daheim.',['des','dem','den'],0],['Trotz ___ Regens spielen sie.',['des','den','der'],0],['Während ___ Unterrichts sprechen wir Deutsch.',['des','dem','den'],0]]]
];
DF_B1_TOPICS.forEach((t,i)=>LESSONS.push({id:'df-b1-'+(i+1),title:t[0],subtitle:t[1],level:'B1',minutes:15,icon:String(i+21).padStart(2,'0'),body:'<p>'+t[1]+'</p><div class="rule">'+t[2]+'</div><p><i>'+t[3]+'</i></p>',quiz:t[4].map(q=>[q[0],q[1],q[2],t[1]])}));
const dfOldGrammarCategories=grammarCategories;
grammarCategories=()=>dfOldGrammarCategories().concat([{name:'More B1 grammar',desc:'Lessons 21–28 · intermediate German',from:20,to:28}]);

document.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(t){e.preventDefault();clickAction(t)}});
document.addEventListener('change',e=>{let t=e.target;const k=t.dataset?.change;if(k==='pack'){ui.pack=Math.min(19,Math.max(0,Number(t.value)||0));prepareQuiz('pack');render()}if(k==='daily-goal'){db.dailyGoal=Number(t.value);persist();toast('Daily goal updated.')}if(k==='quiz-size'){db.quizSize=Number(t.value);persist();ui.quiz=[];toast('Quiz size updated.')}});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){ui.listSearch=e.target.value;ui.listCount=60;const target=el('library-results');if(target)target.innerHTML=libraryCards()}});
document.addEventListener('keydown',e=>{let active=e.target;if(e.key==='Enter'&&active?.id==='article-answer'){e.preventDefault();answerArticle(active.value.toLowerCase().trim());return}if(/^(INPUT|TEXTAREA|SELECT)$/.test(active?.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;if(ui.route==='articles'&&ui.articleMode==='quiz'){if(!ui.submitted&&['1','2','3'].includes(e.key)){e.preventDefault();answerArticle(['der','die','das'][Number(e.key)-1])}else if(ui.submitted&&e.key==='Enter'){e.preventDefault();const b=document.querySelector('[data-action="next-question"]');b?.click()}}else if(ui.route==='flashcards'&&e.key===' '){e.preventDefault();ui.flashFlipped=!ui.flashFlipped;render()}});
el('import-file').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{const next=JSON.parse(await file.text());if(next.version!==1||!next.words||!next.lessons||!next.days||typeof next.words!=='object')throw Error('Invalid backup format');if(!confirm('Replace the progress currently saved in this browser with this backup?'))return;db={...defaultStore(),...next};persist();ui.quiz=[];ui.flashQueue=[];render();toast('Progress successfully restored.')}catch(err){alert('Could not import this backup: '+err.message)}finally{e.target.value=''}});
render();

document.addEventListener('click',e=>{
 if(e.target.closest('[data-action="next-question"]'))requestAnimationFrame(()=>requestAnimationFrame(()=>{
   const c=document.querySelector('.quiz-card')||document.querySelector('.quiz-panel')||document.querySelector('.panel .question-word');
   if(c){const top=Math.max(0,window.scrollY+c.getBoundingClientRect().top-14);window.scrollTo({top,behavior:'instant'});}
 }));
},true);
